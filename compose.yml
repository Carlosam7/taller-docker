services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-api
    environment:
      - PORT=3000
    expose:
      - "3000"
    restart: always

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: always

  redis:
    image: redis:stable-alpine
    container_name: redis
    expose:
      - "6379"
    restart: always
